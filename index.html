<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sessão Bônus — Jogo da Memória</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2E4C4;
    --paper-dark:#E7D3A3;
    --ink:#2B2118;
    --maroon:#7C1F2E;
    --maroon-dark:#5A1521;
    --gold:#B8862F;
    --stampred:#A8324A;
    --bg:#1C1410;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(124,31,46,0.25), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(184,134,47,0.15), transparent 45%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    font-family:'Space Mono', monospace;
    color:var(--ink);
  }
  .wrap{width:100%; max-width:460px;}
  .eyebrow{
    text-align:center;
    color:var(--gold);
    letter-spacing:0.3em;
    font-size:11px;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:34px;
    letter-spacing:0.03em;
    color:var(--paper);
    text-align:center;
    margin:0 0 4px;
    line-height:0.95;
  }
  .sub{
    text-align:center;
    color:var(--paper-dark);
    font-size:12px;
    margin-bottom:22px;
    opacity:0.85;
  }
  .stage{
    background:var(--paper);
    border-radius:10px;
    padding:22px;
    box-shadow:0 25px 60px rgba(0,0,0,0.5);
  }
  .hud{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--maroon-dark);
    margin-bottom:14px;
    text-transform:uppercase;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:9px;
  }
  .card{
    aspect-ratio:1;
    border-radius:8px;
    border:none;
    cursor:pointer;
    position:relative;
    perspective:600px;
    background:transparent;
    padding:0;
  }
  .card-inner{
    width:100%; height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.35s ease;
  }
  .card.flipped .card-inner, .card.matched .card-inner{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden;
  }
  .face-back{
    background:var(--maroon);
    background-image:repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 6px, transparent 6px 12px);
    border:2px solid var(--maroon-dark);
  }
  .face-back::after{
    content:"🎞";
    font-size:20px;
    opacity:0.5;
  }
  .face-front{
    background:var(--paper-dark);
    border:2px solid var(--maroon);
    transform:rotateY(180deg);
    font-size:26px;
  }
  .card.matched .face-front{
    background:var(--gold);
    border-color:var(--gold);
    opacity:0.9;
  }
  .restart{
    display:block;
    margin:16px auto 0;
    background:transparent;
    border:1.5px solid var(--paper-dark);
    color:var(--paper-dark);
    font-family:'Space Mono', monospace;
    font-size:11px;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
  }

  /* Ticket reveal */
  .ticket-wrap{display:none;}
  .ticket-wrap.show{display:block; animation:fadein 0.5s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .ticket{
    position:relative;
    display:flex;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 25px 60px rgba(0,0,0,0.5);
    overflow:hidden;
  }
  .stub{
    width:80px;
    flex-shrink:0;
    background:var(--paper-dark);
    display:flex; align-items:center; justify-content:center;
    border-right:2px dashed var(--maroon);
  }
  .stub-text{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:0.3em;
    font-size:15px;
    color:var(--maroon);
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    white-space:nowrap;
  }
  .main{flex:1; padding:22px 22px 20px; position:relative;}
  .row-top{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:10px; color:var(--maroon-dark); letter-spacing:0.12em; margin-bottom:4px;
  }
  .ticket h2{
    font-family:'Bebas Neue', sans-serif;
    font-size:30px;
    color:var(--maroon);
    margin:2px 0 12px;
    line-height:0.95;
  }
  label{
    display:block; font-size:9px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--maroon-dark); margin-bottom:4px; margin-top:12px;
  }
  input[type="text"], textarea{
    width:100%; border:none; border-bottom:1.5px solid var(--maroon);
    background:transparent; font-family:'Libre Baskerville', serif;
    font-size:14px; color:var(--ink); padding:3px 2px; resize:none;
  }
  input[type="text"]:focus, textarea:focus{outline:none; border-bottom-color:var(--gold);}
  textarea{min-height:46px; line-height:1.5;}
  .chips{display:flex; gap:7px; flex-wrap:wrap;}
  .chip{
    font-family:'Space Mono', monospace; font-size:11px; padding:5px 10px;
    border:1.5px solid var(--maroon); border-radius:20px; background:transparent;
    color:var(--maroon-dark); cursor:pointer;
  }
  .chip.active{background:var(--maroon); color:var(--paper); border-color:var(--maroon);}
  .actions{display:flex; justify-content:flex-end; margin-top:18px;}
  button.stamp-btn{
    font-family:'Bebas Neue', sans-serif; font-size:15px; letter-spacing:0.1em;
    background:var(--maroon); color:var(--paper); border:none;
    padding:10px 20px; border-radius:4px; cursor:pointer;
  }
  button.stamp-btn:hover{background:var(--maroon-dark);}
  .stamp{
    position:absolute; top:20px; right:20px; width:86px; height:86px;
    border:4px solid var(--stampred); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--stampred); font-family:'Bebas Neue', sans-serif; font-size:14px;
    text-align:center; line-height:1.1; transform:rotate(-16deg) scale(2.2);
    opacity:0; pointer-events:none; mix-blend-mode:multiply;
    transition:transform 0.35s cubic-bezier(.2,1.4,.4,1), opacity 0.25s ease;
  }
  .stamp.show{opacity:0.88; transform:rotate(-16deg) scale(1);}
  .result{
    margin-top:14px; background:var(--paper); border-radius:8px; padding:16px 18px;
    display:none; box-shadow:0 12px 30px rgba(0,0,0,0.35);
  }
  .result.show{display:block;}
  .result p{
    font-family:'Libre Baskerville', serif; font-size:13px; line-height:1.6;
    color:var(--ink); white-space:pre-wrap; margin:0;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Cinema Amazonas &middot; Sessão Bônus</div>
  <h1>Ache os pares</h1>
  <div class="sub" id="subtitle">Complete o jogo da memória pra liberar o próximo convite</div>

  <div class="stage" id="stage">
    <div class="hud">
      <span>Jogadas: <span id="moves">0</span></span>
      <span id="pairsLeft">0/8 pares</span>
    </div>
    <div class="grid" id="grid"></div>
    <button class="restart" id="restartBtn">Reiniciar</button>
  </div>

  <div class="ticket-wrap" id="ticketWrap">
    <div class="ticket" id="ticket">
      <div class="stub"><span class="stub-text">SESSÃO BÔNUS</span></div>
      <div class="main">
        <div class="row-top"><span>Nº 0725</span><span id="dateNow"></span></div>
        <h2>Novo pedido<br>de encontro</h2>

        <label for="nome">Para</label>
        <input type="text" id="nome" placeholder="nome dela" maxlength="30" value="Lais Shuki">

        <label>Quando</label>
        <div class="chips" id="chips">
          <button class="chip active" data-v="hoje à noite">Hoje à noite</button>
          <button class="chip" data-v="neste fim de semana">Fim de semana</button>
        </div>

        <label for="msg">Mensagem</label>
        <textarea id="msg">você desvendou o jogo, agora só falta topar mais um encontro comigo :)</textarea>

        <div class="actions">
          <button class="stamp-btn" id="stampBtn">Carimbar convite</button>
        </div>
      </div>
      <div class="stamp" id="stamp">CONFIRMADO</div>
    </div>
    <div class="result" id="result"><p id="resultText"></p></div>
  </div>
</div>

<script>
  const ICONS = ['🎬','🍿','🎟️','💌','🌙','✨','🎡','🍷'];
  let deck = [], flipped = [], matchedCount = 0, moves = 0, lock = false;

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function buildGrid(){
    deck = shuffle([...ICONS, ...ICONS]);
    flipped = []; matchedCount = 0; moves = 0; lock = false;
    document.getElementById('moves').textContent = moves;
    document.getElementById('pairsLeft').textContent = `0/${ICONS.length} pares`;
    document.getElementById('stage').style.display = 'block';
    document.getElementById('ticketWrap').classList.remove('show');
    document.getElementById('subtitle').textContent = 'Complete o jogo da memória pra liberar o próximo convite';

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    deck.forEach((icon, idx)=>{
      const card = document.createElement('button');
      card.className = 'card';
      card.dataset.icon = icon;
      card.dataset.idx = idx;
      card.innerHTML = `
        <div class="card-inner">
          <div class="face face-back"></div>
          <div class="face face-front">${icon}</div>
        </div>`;
      card.addEventListener('click', ()=>onFlip(card));
      grid.appendChild(card);
    });
  }

  function onFlip(card){
    if(lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
    card.classList.add('flipped');
    flipped.push(card);
    if(flipped.length === 2){
      moves++;
      document.getElementById('moves').textContent = moves;
      lock = true;
      const [a,b] = flipped;
      if(a.dataset.icon === b.dataset.icon){
        a.classList.add('matched'); b.classList.add('matched');
        matchedCount++;
        document.getElementById('pairsLeft').textContent = `${matchedCount}/${ICONS.length} pares`;
        flipped = []; lock = false;
        if(matchedCount === ICONS.length){
          setTimeout(revealTicket, 500);
        }
      } else {
        setTimeout(()=>{
          a.classList.remove('flipped'); b.classList.remove('flipped');
          flipped = []; lock = false;
        }, 700);
      }
    }
  }

  function revealTicket(){
    document.getElementById('subtitle').textContent = 'Você achou todos os pares! Convite liberado 🎉';
    document.getElementById('stage').style.display = 'none';
    document.getElementById('ticketWrap').classList.add('show');
    document.getElementById('dateNow').textContent = new Date().toLocaleDateString('pt-BR');
  }

  let quando = 'hoje à noite';
  document.getElementById('chips').addEventListener('click', (e)=>{
    const btn = e.target.closest('.chip');
    if(!btn) return;
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    quando = btn.dataset.v;
  });

  document.getElementById('stampBtn').addEventListener('click', ()=>{
    document.getElementById('ticket').style.transform = 'rotate(-0.6deg)';
    document.getElementById('stamp').classList.add('show');
    const nome = document.getElementById('nome').value.trim() || 'você';
    const msg = document.getElementById('msg').value.trim();
    const texto = `${nome}, ${msg}${quando ? ' — que tal ' + quando + '?' : ''}`;
    const resultBox = document.getElementById('result');
    document.getElementById('resultText').textContent = texto;
    setTimeout(()=>{ resultBox.classList.add('show'); }, 300);
  });

  document.getElementById('restartBtn').addEventListener('click', buildGrid);

  buildGrid();
</script>
</body>
</html>
